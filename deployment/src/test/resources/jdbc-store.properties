# Datasource + JDBC idempotency store for the jdbc-store tests. db-kind is a build-time property, so
# it must come from a real config source (not overrideConfigKey). The H2 INIT parameter creates the
# (idempotent) idempotency table when the in-memory database is opened, so no container is needed.
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:idem-store;DB_CLOSE_DELAY=-1;INIT=CREATE TABLE IF NOT EXISTS idempotency_entry (id VARCHAR(255) PRIMARY KEY, fingerprint VARCHAR(255), in_flight SMALLINT NOT NULL, response BLOB, lock_expires_at BIGINT NOT NULL, response_expires_at BIGINT)
quarkus.idempotency.store=jdbc
